[package]
name = "flute2-mcp"
version = "1.0.0"
edition = "2024"
description = "MCP server that drives the flute2 payments CLI"
license = "MIT"
readme = "readme.md"
repository = "https://github.com/getflute/flute-cli-v2-mcp"
homepage = "https://github.com/getflute/flute-cli-v2-mcp"

# This crate handles payment operations and shells out to an external CLI, so
# unsafe is forbidden outright and the default clippy set is a warning here and
# a hard error in CI (`clippy -- -D warnings`).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[bin]]
name = "flute2-mcp"
path = "src/main.rs"

[lib]
name = "flute2_mcp"
path = "src/lib.rs"

[dependencies]
rmcp = { version = "1.7", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "signal", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "8"
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "test-util"] }
pretty_assertions = "1"
tempfile = "3"
assert_cmd = "2"
serde_json = "1"

[profile.dist]
inherits = "release"
lto = "thin"
